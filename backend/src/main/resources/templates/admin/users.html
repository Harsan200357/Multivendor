<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Users - EMarket Admin')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-7xl mx-auto px-8 py-10 animate-in">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">👥 All Users</h2>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-sm font-semibold text-gray-600 uppercase tracking-wider">
                        <th class="p-4 pl-6">ID</th>
                        <th class="p-4">Username</th>
                        <th class="p-4">Email</th>
                        <th class="p-4 pr-6">Role</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="u : ${users}" class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 pl-6 text-gray-500 font-mono text-sm" th:text="${u.id}">1</td>
                        <td class="p-4 text-gray-900 font-bold" th:text="${u.username}">user</td>
                        <td class="p-4 text-gray-500" th:text="${u.email}">email</td>
                        <td class="p-4 pr-6">
                            <span class="px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full"
                                  th:classappend="${u.role.name() == 'ADMIN' ? 'bg-purple-100 text-purple-700' : (u.role.name() == 'SELLER' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700')}"
                                  th:text="${u.role}">ROLE</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
