<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register - EMarket')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 animate-in">
    <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100 p-8 sm:p-10 w-full max-w-md">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Create Account</h2>
        <p class="text-gray-500 text-center mb-8">Join EMarket today</p>
        
        <div id="error-message" class="hidden mb-6 p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium"></div>
        
        <form onsubmit="handleRegister(event)" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input type="text" id="username" placeholder="Choose a username" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
            </div>
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                <input type="email" id="email" placeholder="your@email.com" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
            </div>
            <div>
                <label for="role" class="block text-sm font-semibold text-gray-700 mb-2">Account Type</label>
                <select id="role" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
                    <option value="USER">🛒 Buyer (User)</option>
                    <option value="SELLER">🏪 Seller</option>
                </select>
            </div>
            
            <div class="pt-2">
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-500/20 hover:shadow-lg hover:shadow-emerald-500/30 hover:-translate-y-0.5 transition-all duration-200">Create Account</button>
                <p class="text-center text-gray-500 text-sm mt-6">Already have an account? <a href="/login" class="text-emerald-600 hover:text-emerald-700 font-semibold underline decoration-2 underline-offset-4">Sign in</a></p>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
