<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cart - EMarket')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-4xl mx-auto px-8 py-10 animate-in">
    <div class="flex items-center justify-between mb-8 border-b border-gray-200 pb-4">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">🛒 Shopping Cart</h2>
    </div>

    <div th:if="${cart != null && !#lists.isEmpty(cart.cartItems)}" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
        <div class="divide-y divide-gray-100">
            <div th:each="item : ${cart.cartItems}" class="p-6 flex items-center justify-between hover:bg-gray-50 transition-colors">
                <div class="flex-1">
                    <div class="text-lg font-bold text-gray-900 mb-1" th:text="${item.product.name}">Product</div>
                    <div class="text-sm font-medium text-gray-500">
                        <span th:text="'Qty: ' + ${item.quantity}">Qty: 1</span>
                        <span th:if="${item.size != null}" th:text="' | Size: ' + ${item.size}"> | Size: M</span>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-xl font-bold text-emerald-600" th:text="'LKR ' + ${item.product.price}">$0</div>
                    <button th:onclick="'removeFromCart(' + ${item.id} + ')'" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors" title="Remove Item">✕</button>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${cart != null && !#lists.isEmpty(cart.cartItems)}" class="bg-gray-50 rounded-2xl p-8 border border-gray-200">
        <div class="flex justify-between items-center mb-6 pb-6 border-b border-gray-200">
            <span class="text-xl font-bold text-gray-700">Total</span>
            <span class="text-3xl font-extrabold text-emerald-600" th:text="'LKR ' + ${total}">$0.00</span>
        </div>
        <div class="flex justify-end">
            <button onclick="placeOrder()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-md shadow-emerald-500/20 hover:shadow-lg hover:shadow-emerald-500/30 hover:-translate-y-0.5 transition-all duration-200 text-lg">🚀 Place Order</button>
        </div>
    </div>

    <div th:if="${cart == null || #lists.isEmpty(cart.cartItems)}" class="text-center py-24 bg-white rounded-2xl border border-dashed border-gray-200 mt-8">
        <div class="text-6xl mb-4">🛒</div>
        <h3 class="text-xl font-bold text-gray-900 mb-2">Your cart is empty</h3>
        <p class="text-gray-500 mb-8">Start shopping to add items to your cart.</p>
        <a href="/products" class="inline-block bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white font-semibold py-3 px-6 rounded-lg transition-colors">Browse Products</a>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
