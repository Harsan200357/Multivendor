<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Orders - EMarket')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-7xl mx-auto px-8 py-10 animate-in">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">📋 Orders for My Products</h2>
    </div>

    <div th:if="${!#lists.isEmpty(orderItems)}" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-sm font-semibold text-gray-600 uppercase tracking-wider">
                        <th class="p-4 pl-6">Product</th>
                        <th class="p-4">Buyer</th>
                        <th class="p-4">Quantity</th>
                        <th class="p-4 pr-6">Price</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="item : ${orderItems}" class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 pl-6 text-gray-900 font-bold">
                            <span th:text="${item.product.name}">Product</span>
                            <span th:if="${item.size != null}" th:text="' (Size: ' + ${item.size} + ')'" class="text-sm font-normal text-gray-500"></span>
                        </td>
                        <td class="p-4 text-gray-600 font-medium" th:text="${item.order.user.username}">Buyer</td>
                        <td class="p-4 text-gray-700" th:text="${item.quantity}">0</td>
                        <td class="p-4 pr-6 text-emerald-600 font-bold" th:text="'LKR ' + ${item.price}">$0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(orderItems)}" class="text-center py-24 bg-white rounded-2xl border border-dashed border-gray-200 mt-8">
        <div class="text-6xl mb-4">📦</div>
        <h3 class="text-xl font-bold text-gray-900 mb-2">No orders yet</h3>
        <p class="text-gray-500">When customers buy your products, orders will appear here.</p>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
