<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Product - EMarket')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-2xl mx-auto px-8 py-10 animate-in">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">
        <h2 class="text-2xl font-extrabold text-gray-900 mb-1">Edit Product</h2>
        <p class="text-gray-500 mb-8">Update your product details</p>

        <div th:if="${error}" class="mb-6 p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium" th:text="${error}"></div>
        <div th:if="${success}" class="mb-6 p-4 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm font-medium" th:text="${success}"></div>

        <form th:action="@{/seller/edit-product/{id}(id=${product.id})}" method="post" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
                <input type="text" id="name" name="name" th:value="${product.name}" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
            </div>
            <div>
                <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                <textarea id="description" name="description" rows="4" th:text="${product.description}" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all resize-y"></textarea>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="price" class="block text-sm font-semibold text-gray-700 mb-2">Price (LKR)</label>
                    <input type="number" id="price" name="price" step="0.01" min="0.01" th:value="${product.price}" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
                </div>
                <div>
                    <label for="stockQuantity" class="block text-sm font-semibold text-gray-700 mb-2">Stock Quantity</label>
                    <input type="number" id="stockQuantity" name="stockQuantity" min="1" th:value="${product.stockQuantity}" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
                </div>
            </div>
            <div>
                <label for="categoryId" class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                <select id="categoryId" name="categoryId" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
                    <option value="">Select a category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                            th:selected="${product.category != null && product.category.id == cat.id}">Category</option>
                </select>
            </div>
            <div>
                <label for="sizes" class="block text-sm font-semibold text-gray-700 mb-2">Available Sizes (comma separated, e.g. S, M, L, XL or 38, 39, 40)</label>
                <input type="text" id="sizes" name="sizes" th:value="${product.sizes != null ? #strings.listJoin(product.sizes, ', ') : ''}" placeholder="S, M, L or 38, 39, 40" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
            </div>
            <div th:if="${product.imageUrls != null and !#lists.isEmpty(product.imageUrls)}" class="p-4 bg-gray-50 rounded-xl border border-gray-100">
                <label class="block text-sm font-semibold text-gray-700 mb-3">Current Images</label>
                <div class="flex gap-2 flex-wrap">
                    <img th:each="img : ${product.imageUrls}" th:src="${img}" alt="Product Image" class="max-w-[100px] rounded-lg border border-gray-200">
                </div>
            </div>
            <div>
                <label for="imageFiles" class="block text-sm font-semibold text-gray-700 mb-2">Product Images (Upload Files)</label>
                <input type="file" id="imageFiles" name="imageFiles" accept="image/*" multiple class="w-full text-sm text-gray-500 bg-gray-50 border border-gray-200 rounded-xl file:mr-4 file:py-2 file:px-4 file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 transition-all">
            </div>
            <div>
                <label for="imageUrls" class="block text-sm font-semibold text-gray-700 mb-2">Or Product Image URLs (comma separated)</label>
                <input type="text" id="imageUrls" name="imageUrls" th:value="${product.imageUrls != null ? #strings.listJoin(product.imageUrls, ', ') : ''}" placeholder="https://example.com/img1.jpg, https://example.com/img2.jpg" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all">
            </div>
            <div class="pt-4">
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-500/20 hover:shadow-lg hover:shadow-emerald-500/30 hover:-translate-y-0.5 transition-all duration-200">💾 Update Product</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
