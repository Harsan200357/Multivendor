<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seller Dashboard - EMarket')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="max-w-7xl mx-auto px-8 py-10">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">📦 My Products</h2>
        <a th:href="@{/seller/add-product}" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-5 rounded-xl shadow-sm shadow-emerald-500/20 hover:-translate-y-0.5 transition-all duration-200">Add New Product</a>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-sm font-semibold text-gray-600 uppercase tracking-wider">
                        <th class="p-4 pl-6">Name</th>
                        <th class="p-4">Description</th>
                        <th class="p-4">Price</th>
                        <th class="p-4">Stock</th>
                        <th class="p-4">Category</th>
                        <th class="p-4 pr-6">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="product : ${products}" class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 pl-6 text-gray-900 font-bold" th:text="${product.name}"></td>
                        <td class="p-4 text-gray-500 text-sm max-w-xs truncate" th:text="${product.description}"></td>
                        <td class="p-4 text-emerald-600 font-bold" th:text="${product.price}"></td>
                        <td class="p-4 text-gray-700" th:text="${product.stockQuantity}"></td>
                        <td class="p-4 text-gray-500" th:text="${product.category != null ? product.category.name : 'N/A'}"></td>
                        <td class="p-4 pr-6">
                            <div class="flex items-center gap-2">
                                <a th:href="@{'/seller/edit-product/' + ${product.id}}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold text-sm px-3 py-1.5 rounded-lg transition-colors">Edit</a>
                                <form th:action="@{'/seller/delete-product/' + ${product.id}}" method="post" class="inline">
                                    <button type="submit" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-sm px-3 py-1.5 rounded-lg transition-colors" onclick="return confirm('Delete this product?');">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
