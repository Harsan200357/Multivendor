<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Products - EMarket')}">
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="max-w-7xl mx-auto px-8 py-10 animate-in">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">📦 My Products</h2>
        <a href="/seller/add-product" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-5 rounded-xl shadow-sm shadow-emerald-500/20 hover:-translate-y-0.5 transition-all duration-200">➕ Add Product</a>
    </div>

    <div th:if="${!#lists.isEmpty(products)}" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-200 text-sm font-semibold text-gray-600 uppercase tracking-wider">
                        <th class="p-4 pl-6">Name</th>
                        <th class="p-4">Category</th>
                        <th class="p-4">Price</th>
                        <th class="p-4">Stock</th>
                        <th class="p-4 pr-6">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="product : ${products}" class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 pl-6 text-gray-900 font-bold" th:text="${product.name}">Product</td>
                        <td class="p-4 text-gray-500 font-medium" th:text="${product.category != null ? product.category.name : 'N/A'}">Category</td>
                        <td class="p-4 text-emerald-600 font-bold" th:text="'LKR ' + ${product.price}">$0</td>
                        <td class="p-4 text-gray-700" th:text="${product.stockQuantity}">0</td>
                        <td class="p-4 pr-6">
                            <a th:href="@{/seller/edit-product/{id}(id=${product.id})}" class="inline-flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold text-sm px-3 py-1.5 rounded-lg transition-colors">✏️ Edit</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="text-center py-24 bg-white rounded-2xl border border-dashed border-gray-200 mt-8">
        <div class="text-6xl mb-4">🏪</div>
        <h3 class="text-xl font-bold text-gray-900 mb-2">No products yet</h3>
        <p class="text-gray-500 mb-8">Add your first product to start selling!</p>
        <a href="/seller/add-product" class="inline-block bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 px-6 rounded-xl transition-colors shadow-sm">Add Product</a>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
